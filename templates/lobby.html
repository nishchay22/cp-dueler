<!DOCTYPE html>
<html>
<head>
    <title>Duel Arena</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #1e1e1e; color: #eee; text-align: center; }
        .container { max-width: 1000px; margin: 0 auto; padding: 20px; }
        
        /* Timer & Header */
        #timer-display { font-size: 2.5em; font-weight: bold; color: #ffeb3b; margin: 10px; }
        
        /* Leaderboard Table */
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #2d2d2d; }
        th, td { padding: 12px; border: 1px solid #444; text-align: center; }
        th { background: #333; }
        .solved-check { color: #4caf50; font-weight: bold; }
        
        /* Problems Grid */
        .problem-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 20px; }
        .problem-card { background: #333; padding: 15px; border-radius: 8px; min-width: 150px; }
        .problem-card a { color: #64b5f6; text-decoration: none; font-size: 1.1em; display: block; }
        .problem-rating { font-size: 0.8em; color: #aaa; }
        
        /* Setup UI */
        .btn { padding: 10px 20px; cursor: pointer; border: none; border-radius: 4px; font-size: 16px; margin: 5px; }
        .btn-ready { background: #ff9800; color: white; }
        .btn-start { background: #2196f3; color: white; }
        .ready-true { color: #4caf50; }
        .ready-false { color: #f44336; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Room: {{ room_id }} <span style="font-size:0.6em">({{ mode }} / {{ duration }} mins)</span></h2>
        <div id="timer-display">00:00:00</div>
        
        <div id="setup-ui">
            <input type="text" id="handle" placeholder="Enter CF Handle" style="padding:10px;">
            <button class="btn" onclick="join()">Join</button>
            <div id="players-list" style="margin-top:20px;"></div>
            <button id="btn-ready" class="btn btn-ready" style="display:none" onclick="toggleReady()">I'm Ready</button>
            <button id="btn-start" class="btn btn-start" style="display:none" onclick="startGame()">START</button>
        </div>

        <div id="game-ui" style="display:none;">
            <div id="problems-area" class="problem-grid"></div>
            
            <h3>Live Standings</h3>
            <div id="leaderboard-area">
                <table>
                    <thead>
                        <tr>
                            <th>Rank</th>
                            <th>User</th>
                            <th>Solved</th>
                            <th>Penalty</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboard-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        const roomId = "{{ room_id }}";
        let myHandle = "";
        let targetProblemIds = []; 
        let pollingInterval = null;
        let endTime = 0;

        // --- SETUP LOGIC ---
        function join() {
            const h = document.getElementById('handle').value;
            if(!h) return;
            myHandle = h.trim();
            document.getElementById('btn-ready').style.display = 'inline-block';
            socket.emit('join', {room: roomId, handle: myHandle});
        }
        function toggleReady() { socket.emit('toggle_ready', {room: roomId, handle: myHandle}); }
        function startGame() { socket.emit('start_game', {room: roomId}); }

        socket.on('update_players', (players) => {
            document.getElementById('players-list').innerHTML = players.map(p => 
                `<div>${p.handle} - <span class="${p.ready?'ready-true':'ready-false'}">${p.ready?'READY':'WAITING'}</span></div>`
            ).join('');
            
            const allReady = players.length > 0 && players.every(p => p.ready);
            document.getElementById('btn-start').style.display = allReady ? 'inline-block' : 'none';
        });

        // --- GAME LOGIC ---
        socket.on('game_started', (data) => {
            document.getElementById('setup-ui').style.display = 'none';
            document.getElementById('game-ui').style.display = 'block';
            
            // 1. Setup Problems
            targetProblemIds = (data.track_ids || []).map(String);
            document.getElementById('problems-area').innerHTML = data.problems.map((p, idx) => `
                <div class="problem-card">
                    <div class="problem-rating">${p.rating}</div>
                    <a href="${p.url}" target="_blank">Problem ${String.fromCharCode(65+idx)}</a>
                    <div style="font-size:0.8em; color:#888;">${p.name}</div>
                </div>
            `).join('');

            // 2. Setup Timer
            endTime = data.end_time * 1000; // Convert to MS
            setInterval(updateTimer, 1000);
            updateTimer();

            // 3. Start Polling
            startPolling(data.problems);
        });

        function updateTimer() {
            const now = Date.now();
            const diff = endTime - now;
            if (diff <= 0) {
                document.getElementById('timer-display').innerText = "TIME UP";
                if(pollingInterval) clearInterval(pollingInterval);
                return;
            }
            const h = Math.floor(diff / 3600000);
            const m = Math.floor((diff % 3600000) / 60000);
            const s = Math.floor((diff % 60000) / 1000);
            document.getElementById('timer-display').innerText = 
                `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
        }

        // --- LEADERBOARD LOGIC ---
        socket.on('update_leaderboard', (scores) => {
            const tbody = document.getElementById('leaderboard-body');
            
            // Convert Dict to Array & Sort
            const sortedPlayers = Object.keys(scores).map(handle => ({
                handle: handle,
                solved: scores[handle].solved.length,
                penalty: scores[handle].penalty
            })).sort((a, b) => {
                if (b.solved !== a.solved) return b.solved - a.solved; // More solved = better
                return a.penalty - b.penalty; // Less penalty = better
            });

            tbody.innerHTML = sortedPlayers.map((p, i) => `
                <tr>
                    <td>#${i+1}</td>
                    <td style="font-weight:bold; color: ${p.handle===myHandle?'#4caf50':'#eee'}">${p.handle}</td>
                    <td>${p.solved}</td>
                    <td>${p.penalty}</td>
                </tr>
            `).join('');
        });
        
        socket.on('notification', (msg) => {
            // Optional: Toast notification
            console.log(msg);
        });

        socket.on('game_over', (data) => {
            alert(`GAME OVER! Winner: ${data.winner}`);
            location.reload();
        });

        // --- POLLING ---
        function startPolling(problems) {
            // Keep track of what I have locally solved to stop spamming server
            let mySolved = new Set();
            
            pollingInterval = setInterval(async () => {
                try {
                    const res = await fetch(`https://codeforces.com/api/user.status?handle=${myHandle}&from=1&count=5`);
                    const data = await res.json();
                    if (data.status === 'OK') {
                        for (const sub of data.result) {
                            if (sub.verdict === 'OK') {
                                const pid = String(sub.problem.contestId) + sub.problem.index;
                                if (targetProblemIds.includes(pid) && !mySolved.has(pid)) {
                                    console.log("Solved new problem:", pid);
                                    mySolved.add(pid);
                                    // Report to Server
                                    socket.emit('report_solve', {
                                        room: roomId,
                                        winner: myHandle,
                                        problem_id: pid
                                    });
                                }
                            }
                        }
                    }
                } catch(e) { console.log(e); }
            }, 5000);
        }
    </script>
</body>
</html>
