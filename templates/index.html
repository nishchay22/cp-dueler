<!DOCTYPE html>
<html lang="en" data-theme="cyberpunk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CP Dueler - Enter the Arena</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.4.19/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;800&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-image: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #000 100%); }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        
        /* Card Selection Effect */
        .mode-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); border: 2px solid transparent; }
        .mode-card:hover { transform: translateY(-5px); border-color: oklch(var(--p)); box-shadow: 0 0 20px rgba(255, 0, 212, 0.2); }
        .mode-card.selected { border-color: oklch(var(--a)); background: oklch(var(--a) / 0.1); box-shadow: 0 0 30px oklch(var(--a) / 0.3); }
        
        /* Glitch Title Animation */
        .glitch { position: relative; color: white; }
        .glitch::before, .glitch::after { content: attr(data-text); position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .glitch::before { left: 2px; text-shadow: -1px 0 red; clip: rect(24px, 550px, 90px, 0); animation: glitch-anim-2 3s infinite linear alternate-reverse; }
        .glitch::after { left: -2px; text-shadow: -1px 0 blue; clip: rect(85px, 550px, 140px, 0); animation: glitch-anim 2.5s infinite linear alternate-reverse; }
        @keyframes glitch-anim { 0% { clip: rect(11px, 9999px, 81px, 0); } 100% { clip: rect(78px, 9999px, 15px, 0); } }
        @keyframes glitch-anim-2 { 0% { clip: rect(65px, 9999px, 100px, 0); } 100% { clip: rect(40px, 9999px, 2px, 0); } }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="max-w-4xl w-full">
        
        <div class="text-center mb-12">
            <h1 class="text-6xl md:text-8xl font-black font-mono glitch tracking-tighter mb-4" data-text="CP DUELER">CP DUELER</h1>
            <p class="text-xl text-base-content/60">Competitive Programming Battlegrounds</p>
        </div>

        <div class="card bg-base-200 shadow-2xl border border-primary/20 p-6 md:p-10">
            
            <label class="label mb-2"><span class="label-text font-bold text-secondary">SELECT PROTOCOL</span></label>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
                
                <div class="mode-card card bg-base-100 cursor-pointer selected" onclick="selectMode(this, 'classic')">
                    <div class="card-body p-5 items-center text-center">
                        <span class="text-4xl mb-2">⚔️</span>
                        <h3 class="card-title text-sm">CLASSIC 1v1</h3>
                        <p class="text-xs opacity-60">Standard Duel. First to solve wins.</p>
                    </div>
                </div>

                <div class="mode-card card bg-base-100 cursor-pointer" onclick="selectMode(this, 'lockout')">
                    <div class="card-body p-5 items-center text-center">
                        <span class="text-4xl mb-2">🔒</span>
                        <h3 class="card-title text-sm">LOCKOUT</h3>
                        <p class="text-xs opacity-60">Race to claim problems. Block your opponent.</p>
                    </div>
                </div>

                <div class="mode-card card bg-base-100 cursor-pointer" onclick="selectMode(this, 'div3')">
                    <div class="card-body p-5 items-center text-center">
                        <span class="text-4xl mb-2">🏆</span>
                        <h3 class="card-title text-sm">CONTEST</h3>
                        <p class="text-xs opacity-60">Div 2, 3, 4 formats. Points penalty system.</p>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                
                <div id="rating-group" class="form-control w-full">
                    <label class="label"><span class="label-text font-bold">DIFFICULTY RATING</span></label>
                    <input type="range" min="800" max="3000" value="1200" class="range range-primary" step="100" id="rating-slider" oninput="updateRatingLabel(this.value)" />
                    <div class="w-full flex justify-between text-xs px-2 mt-2">
                        <span>800</span>
                        <span id="rating-val" class="text-primary font-bold text-lg">1200</span>
                        <span>3000</span>
                    </div>
                </div>

                <div id="div-group" class="form-control w-full hidden">
                    <label class="label"><span class="label-text font-bold">DIVISION</span></label>
                    <select id="div-select" class="select select-bordered select-accent w-full font-mono text-lg">
                        <option value="div4">Div 4 (Beginner)</option>
                        <option value="div3" selected>Div 3 (Standard)</option>
                        <option value="div2">Div 2 (Expert)</option>
                    </select>
                </div>

                <div class="form-control w-full">
                    <label class="label"><span class="label-text font-bold">TIME LIMIT (MIN)</span></label>
                    <div class="join">
                        <button class="btn join-item" onclick="adjTime(-10)">-</button>
                        <input id="duration" class="input input-bordered join-item w-full text-center font-mono text-lg" value="30" readonly />
                        <button class="btn join-item" onclick="adjTime(10)">+</button>
                    </div>
                </div>
            </div>

            <button class="btn btn-primary btn-lg w-full font-black text-xl tracking-widest hover:scale-[1.02] transition-transform shadow-lg shadow-primary/40" onclick="createLobby()">
                INITIALIZE LOBBY
            </button>
            
        </div>

        <div class="text-center mt-8 text-xs opacity-30 font-mono">
            SYSTEM ONLINE // V2.0.4 // SECURE CONNECTION
        </div>

    </div>

    <input type="hidden" id="selectedMode" value="classic">

    <script>
        function selectMode(element, mode) {
            // UI Update
            document.querySelectorAll('.mode-card').forEach(c => c.classList.remove('selected'));
            element.classList.add('selected');
            
            // Logic Update
            document.getElementById('selectedMode').value = mode;
            
            // Toggle Inputs based on Mode
            const ratingGroup = document.getElementById('rating-group');
            const divGroup = document.getElementById('div-group');

            // If it's a specific "Div" mode (contest), show Div selector
            if (['div2', 'div3', 'div4'].includes(mode) || mode === 'contest') {
                ratingGroup.classList.add('hidden');
                divGroup.classList.remove('hidden');
                // Ensure backend receives the specific div chosen in the dropdown
                document.getElementById('selectedMode').value = document.getElementById('div-select').value;
            } else {
                // Classic or Lockout
                ratingGroup.classList.remove('hidden');
                divGroup.classList.add('hidden');
            }
        }

        // Keep dropdown synced with hidden input for Contests
        document.getElementById('div-select').addEventListener('change', (e) => {
            document.getElementById('selectedMode').value = e.target.value;
        });

        function updateRatingLabel(val) {
            document.getElementById('rating-val').innerText = val;
        }

        function adjTime(amount) {
            const input = document.getElementById('duration');
            let val = parseInt(input.value) + amount;
            if(val < 10) val = 10;
            if(val > 180) val = 180;
            input.value = val;
        }

        async function createLobby() {
            const btn = document.querySelector('.btn-primary');
            const originalText = btn.innerText;
            btn.innerText = "CONNECTING...";
            btn.disabled = true;

            const mode = document.getElementById('selectedMode').value;
            const rating = document.getElementById('rating-slider').value;
            const duration = document.getElementById('duration').value;

            try {
                const res = await fetch('/create', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                    body: `mode=${mode}&rating=${rating}&duration=${duration}`
                });
                
                if(!res.ok) throw new Error("Server error");
                
                const data = await res.json();
                window.location.href = `/lobby/${data.room_id}`;
            } catch (e) {
                alert("Connection Failed: " + e.message);
                btn.innerText = "ERROR";
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.disabled = false;
                }, 2000);
            }
        }
    </script>
</body>
</html>
